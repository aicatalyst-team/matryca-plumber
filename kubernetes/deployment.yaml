apiVersion: apps/v1
kind: Deployment
metadata:
  name: matryca-plumber
  namespace: poc-matryca-plumber
  labels:
    app: matryca-plumber
    managed-by: autopoc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matryca-plumber
  template:
    metadata:
      labels:
        app: matryca-plumber
    spec:
      imagePullSecrets:
        - name: internal-registry-dockercfg
      containers:
        - name: matryca-plumber
          image: image-registry.openshift-image-registry.svc:5000/autopoc-test-builds/matryca-plumber:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: MATRYCA_UI_ALLOW_LAN
              value: "1"
            - name: MATRYCA_UI_TOKEN
              value: "poc-demo-token-2026"
            - name: LOGSEQ_GRAPH_PATH
              value: "/opt/app-root/data"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
